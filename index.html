<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uschi's Skincare Guide</title>
<style>html,body{margin:0;background:#eceee9}</style>
</head>
<body>
<div id="sg">
<style>
#sg{--bg:#eceee9;--paper:#f8f8f5;--ink:#262a26;--soft:#6c736b;--moss:#58654f;--blush:#e6d6d0;--line:#d5d9d1;
  font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:var(--bg);padding:clamp(20px,6vw,88px);max-width:1040px;margin:0 auto;box-sizing:border-box;line-height:1.55}
#sg *{box-sizing:border-box}
#sg h2{font-weight:300;font-size:clamp(30px,5vw,54px);line-height:1.1;margin:0 0 16px;letter-spacing:-.02em}
#sg .intro b{color:var(--ink);font-weight:600}
#sg .intro{max-width:72ch;color:var(--soft);margin:0 0 32px;font-size:15px}
#sg h3{font-weight:500;font-size:17px;margin:0 0 12px}
#sg h3 small{font-weight:400;font-size:13px;color:var(--soft);margin-left:8px}
#sg .tabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin:0 0 32px}
#sg .tab{font:inherit;font-size:16px;background:none;border:0;border-bottom:2px solid transparent;padding:12px 0;margin-bottom:-1px;color:var(--soft);cursor:pointer;transition:color .2s,border-color .2s}
#sg .tab:hover{color:var(--ink)}
#sg .tab[aria-selected="true"]{color:var(--ink);font-weight:500;border-bottom-color:var(--moss)}
#sg .chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 28px}
#sg .chip{font:inherit;font-size:14px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
#sg .chip:hover{border-color:var(--moss)}
#sg .chip[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:#fff}
#sg .tab:focus-visible,#sg .chip:focus-visible,#sg .btn:focus-visible,#sg a:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
#sg .tip{background:var(--blush);border-radius:20px;padding:20px 24px;max-width:62ch;margin:6px 0 40px;font-size:14px}
#sg .tip b{font-weight:600;font-size:16px;display:block;margin-bottom:2px}
#sg .sum{max-width:62ch;font-size:14px;color:var(--soft);margin:0 0 28px}
#sg .sum b{color:var(--ink);font-weight:500}
/* Produkte-Raster */
#sg .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px}
#sg .card{display:flex;flex-direction:column;text-decoration:none;color:inherit}
#sg .img{flex:1;display:flex;align-items:flex-end;justify-content:center;margin-bottom:14px}
#sg .img img{display:block;width:190px;max-width:100%;height:auto;max-height:240px;object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.05) contrast(1.02)}
#sg .img span{font-size:13px;color:var(--soft);text-align:center}
#sg .step{font-size:13px;color:var(--moss);margin-bottom:2px}
#sg .name{font-weight:500;font-size:16px;line-height:1.3;margin:0 0 6px}
#sg .note{font-size:14px;color:var(--soft);margin:0 0 10px}
#sg .go{font-size:14px;border-bottom:1px solid var(--ink);align-self:flex-start;padding-bottom:1px}
#sg .empty{color:var(--soft);padding:30px 0}
/* Routine */
#sg .routine{list-style:none;margin:0;padding:0}
#sg .row{border-top:1px solid var(--line)}
#sg .row:last-child{border-bottom:1px solid var(--line)}
#sg .rowlink{display:grid;grid-template-columns:34px 96px 1fr;gap:6px 20px;align-items:center;padding:22px 0;text-decoration:none;color:inherit}
#sg .num{width:34px;height:34px;border-radius:50%;background:var(--moss);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
#sg .rimg{display:block}
#sg .rimg img{display:block;width:100%;height:auto;max-height:120px;object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.05) contrast(1.02)}
#sg .rimg span{display:block;font-size:11px;color:var(--soft)}
#sg .info{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.45;margin:0 0 10px;padding:10px 14px;border-radius:12px;background:#dcebf5;border-left:3px solid #7fb0d3;max-width:56ch}
#sg .info svg{flex:none;margin-top:1px;color:#3f6a8a}
#sg .hint{font-size:12px;color:var(--soft);margin:-4px 0 10px;max-width:56ch}
#sg .warn{font-size:13px;margin:0 0 10px;padding:10px 14px;border-radius:12px;background:var(--blush);border-left:3px solid #b5654f;max-width:56ch}
#sg .warn{margin:0}
#sg .extra{margin:-6px 0 24px 170px;max-width:56ch}
#sg .extra[hidden]{display:none}
#sg .altlink{display:flex;align-items:center;gap:12px;margin-top:12px;text-decoration:none;color:inherit}
#sg .aimg{width:44px;flex:none;display:block}
#sg .aimg img{display:block;width:100%;height:auto;max-height:55px;object-fit:contain;mix-blend-mode:multiply;filter:brightness(1.05) contrast(1.02)}
#sg .aimg span{font-size:9px;color:var(--soft)}
#sg .alabel{display:block;font-size:12px;color:var(--soft)}
#sg .aname{display:block;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
#sg .daytoggle{display:inline-flex;gap:4px;padding:5px;margin:0 0 30px;background:var(--paper);border:1px solid var(--line);border-radius:999px}
#sg .dt{font:inherit;font-size:15px;display:flex;align-items:center;gap:9px;padding:11px 26px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s}
#sg .dt:hover{background:var(--bg)}
#sg .dt[aria-pressed="true"]{background:var(--moss);color:#fff}
#sg .dt:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
#sg #sg-lnote{margin-top:-14px}
#sg .price{margin-left:14px;font-size:14px;color:var(--soft)}
#sg .price del{color:var(--soft)}
#sg .price b{color:var(--ink);font-weight:500}
#sg .off{font-size:12px;background:var(--blush);color:var(--ink);border-radius:999px;padding:1px 8px;margin-left:4px}
#sg .card .price{display:block;margin:6px 0 0}
#sg .dbg{font-size:13px;max-width:62ch;margin:0 0 28px;padding:12px 16px;border:1px solid var(--line);border-radius:12px}
#sg .dbg summary{cursor:pointer;font-size:14px;font-weight:500}
#sg .dbg summary:focus-visible{outline:2px solid var(--moss);outline-offset:3px}
#sg .dbg .dbgbody{margin-top:10px}
#sg .dbg a{color:inherit}
#sg .dbg ul{margin:6px 0 0;padding-left:18px}
#sg .budget{max-width:420px;margin:0 0 28px}
#sg .budget[hidden]{display:none}
#sg .budget input[type=range]{width:100%;accent-color:var(--moss);margin:4px 0}
#sg .blabels{display:flex;justify-content:space-between;font-size:12px;color:var(--soft)}
#sg .chips[hidden]{display:none}
#sg .tag.on{background:var(--moss);color:#fff}
#sg .card .step{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
#sg .lvl{font-size:11px;line-height:1.4;padding:2px 9px;border-radius:999px;background:#dcebf5;color:#2f5671}
#sg .card .tag{background:transparent;border:1px solid var(--line)}
#sg .card .tag.on{background:var(--moss);border-color:var(--moss);color:#fff}
#sg .tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
#sg .tag{font-size:12px;padding:3px 11px;border-radius:999px;background:var(--blush)}
/* Speichern */
#sg .savebar{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0 0}
#sg .btn{font:inherit;font-size:14px;padding:11px 22px;border-radius:999px;border:1px solid var(--moss);background:var(--moss);color:#fff;cursor:pointer;transition:opacity .2s}
#sg .btn:hover{opacity:.85}
#sg .btn.ghost{background:transparent;color:var(--ink)}
#sg .savemsg{font-size:13px;color:var(--soft);margin:14px 0 0;max-width:62ch}
#sg .preview{margin-top:18px;max-width:420px}
#sg .preview img{width:100%;display:block;border-radius:12px;border:1px solid var(--line)}
#sg .preview a{display:inline-block;margin-top:10px;font-size:14px;color:var(--ink)}
#sg .copybox{width:100%;max-width:560px;height:170px;font:inherit;font-size:13px;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
@media (max-width:520px){#sg .rimg img{max-height:95px}#sg .extra{margin-left:134px}#sg .rowlink{grid-template-columns:30px 76px 1fr;gap:6px 14px}#sg .num{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){#sg *{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">

<h2>Uschi's Skincare Guide</h2>
<p class="intro"><b>Ich hab hier wat janz Spezielles. Nur für dich &lt;3</b><br>Garantiert ohne L'Oréal, Neutrogena und ähnliche große Kosmetikhäuser</p>

<div class="tabs" role="tablist" id="sg-tabs"></div>

<h3>Dein Hauttyp</h3>
<div class="chips" id="sg-types"></div>
<h3>Deine Themen<small>mehrere möglich</small></h3>
<div class="chips" id="sg-concerns"></div>
<h3 id="sg-lh">Deine Erfahrung<small>mit starken Wirkstoffen</small></h3>
<div class="chips" id="sg-levels"></div>
<p class="sum" id="sg-lnote" hidden></p>
<h3 id="sg-bh" hidden>Dein Budget<small id="sg-bval"></small></h3>
<div class="budget" id="sg-budget" hidden></div>
<div class="tip" id="sg-tip" hidden></div>
<div id="sg-out"></div>

<script>
(function(){
/* Produkte kommen aus dem Ordner "produkte" im Repository (siehe loadProducts unten). */
var PRODUCTS=[],loading=true;
/* Reihenfolge der Routine. base:true = Basis-Schritt, kommt immer vor. when = morgens/abends, max = Produkte pro Schritt. */
var STEPS=[
 {k:"Reinigungs-Öle",base:true,oil:true,when:["pm"],max:1},
 {k:"Reinigungs-Cleanser",base:true,cleanser:true,when:["am","pm"],max:1},
 {k:"Toner",when:["am","pm"],max:1},
 {k:"Serum",when:["am","pm"],max:2},
 {k:"Retinol / Anti-Aging",when:["pm"],max:1,hint:"Langsam einführen, nicht am selben Abend mit Peelings kombinieren und tagsüber Sonnenschutz tragen. Nicht in Schwangerschaft und Stillzeit anwenden."},
 {k:"Creme",base:true,when:["am","pm"],max:1},
 {k:"Sonnenschutz",base:true,when:["am"],max:1}
];
var TYPES={alle:"Alle",trocken:"Trocken",fettig:"Fettig",mischhaut:"Mischhaut",empfindlich:"Empfindlich",normal:"Normal"};
var CONCERNS={akne:"Unreinheiten",roetungen:"Rötungen",falten:"Feine Linien",pigment:"Pigmentflecken",poren:"Große Poren",feuchtigkeit:"Feuchtigkeit",antiaging:"Anti Aging",makeup:"Make-up"};
var TIPS={
 trocken:["Trockene Haut","Setze auf milde Reinigung und reichhaltige Cremes mit Lipiden und Hyaluron."],
 fettig:["Fettige Haut","Leichte Gel-Texturen und ein sanfter Wirkstoff wie Niacinamid halten den Glanz im Zaum."],
 mischhaut:["Mischhaut","Pflege die T-Zone leicht und die Wangen etwas reichhaltiger."],
 empfindlich:["Empfindliche Haut","Wenige Produkte, keine Duftstoffe, neue Dinge einzeln und langsam einführen."],
 normal:["Normale Haut","Du hast viel Spielraum. Konzentriere dich auf Sonnenschutz und ein Serum für dein Thema."]
};
var TABS={routine:"Deine Routine",produkte:"Alle Produkte"};
var TIMES={am:"Morgens",pm:"Abends"};
var LEVELS={anfaenger:"Anfänger",erfahren:"Erfahren",fortgeschritten:"Fortgeschritten",experte:"Experte"};
var ICON={am:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',pm:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'};
var lvlRel=true,ignoreLvl=false;
var tab="routine",selT="alle",selC=[],time="am",selL="anfaenger",selB=null,CACHE={};
try{CACHE=JSON.parse(localStorage.getItem("sg-meta2")||"{}")}catch(e){}
/* letzte Auswahl dieses Besuchers wiederherstellen */
try{var S=JSON.parse(localStorage.getItem("sg-sel")||"{}");
 if(S.t&&TYPES[S.t])selT=S.t;
 if(S.c&&S.c.filter)selC=S.c.filter(function(c){return CONCERNS[c]});
 if(S.m&&TIMES[S.m])time=S.m;
 if(S.l&&LEVELS[S.l])selL=S.l;
 if(typeof S.b==="number")selB=S.b}catch(e){}
function save(){try{localStorage.setItem("sg-meta2",JSON.stringify(CACHE))}catch(e){}}
function esc(s){return String(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function $(id){return document.getElementById(id)}

/* ---------- Produkte aus Dateien laden ---------- */
var CFG={ordner:"produkte"};
var ALIAS={"anti-aging":"antiaging","anti aging":"antiaging","anti_aging":"antiaging","antiaging":"antiaging","retinol":"antiaging","retinal":"antiaging","make-up":"makeup","make up":"makeup","schminke":"makeup","unreinheiten":"akne","pickel":"akne","rötungen":"roetungen","feine linien":"falten","linien":"falten","pigmentflecken":"pigment","pigmentierung":"pigment","große poren":"poren","grosse poren":"poren"};
function cmpName(a,b){return a.localeCompare(b,undefined,{numeric:true})}
function baseUrl(){return location.origin+location.pathname.replace(/[^\/]*$/,"")}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}
function repoInfo(){
 var m=location.hostname.match(/^([^.]+)\.github\.io$/i),p=location.pathname.split("/").filter(Boolean);
 return m?{owner:m[1],repo:p[0]||(m[1]+".github.io")}:null;
}
function listFiles(){
 var ck=null;
 try{ck=JSON.parse(localStorage.getItem("sg-files")||"null")}catch(e){}
 if(ck&&Date.now()-ck.t<120000)return Promise.resolve(ck.l);
 var fallback=function(){
  return getJSON(baseUrl()+CFG.ordner+"/dateien.json").catch(function(){return ck?ck.l:[]});
 };
 var ri=repoInfo();
 if(!ri)return fallback();
 return getJSON("https://api.github.com/repos/"+ri.owner+"/"+ri.repo+"/contents/"+CFG.ordner)
  .then(function(a){
   var l=a.filter(function(f){return f.type==="file"&&/\.json$/i.test(f.name)&&f.name.charAt(0)!=="_"&&f.name!=="dateien.json"})
    .map(function(f){return f.name}).sort(cmpName);
   try{localStorage.setItem("sg-files",JSON.stringify({t:Date.now(),l:l}))}catch(e){}
   return l;
  })
  .catch(fallback);
}
var SA={"reinigung":"Reinigungs-Cleanser","reinigung-cleanser":"Reinigungs-Cleanser","cleanser":"Reinigungs-Cleanser","reinigungs-öle":"Reinigungs-Öle","reinigungsöle":"Reinigungs-Öle","reinigungsöl":"Reinigungs-Öle","reinigungs-oele":"Reinigungs-Öle","reinigungsoel":"Reinigungs-Öle","öl":"Reinigungs-Öle","oel":"Reinigungs-Öle","balsam":"Reinigungs-Öle","reinigungsbalsam":"Reinigungs-Öle","retinol":"Retinol / Anti-Aging","retinal":"Retinol / Anti-Aging","anti-aging":"Retinol / Anti-Aging","anti aging":"Retinol / Anti-Aging","retinol/anti-aging":"Retinol / Anti-Aging"};
function stepName(v){
 var st=String(v||"").trim();
 st=SA[st.toLowerCase()]||st;
 STEPS.forEach(function(x){if(x.k.toLowerCase()===st.toLowerCase())st=x.k});
 return st;
}
function norm(r){
 var tags=(r.tags||[]).map(function(t){t=String(t).toLowerCase().trim();return ALIAS[t]||t});
 var st=stepName(r.schritt);
 var lv=[].concat(r.erfahrung||[]).map(function(x){x=String(x).toLowerCase().replace(/ä/g,"ae").replace(/\s+/g,"");return LEVELS[x]?x:null}).filter(Boolean);
 var z=[].concat(r.zeit||[]).join(" ").toLowerCase(),when=null;
 if(z){when=[];if(z.indexOf("morgen")>-1)when.push("am");if(z.indexOf("abend")>-1)when.push("pm");if(!when.length)when=null}
 return{
  url:r.link,old:(function(v){if(v===undefined||v===null||v==="")return null;var n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n})(r.preis_alt),price:(function(v){if(v===undefined||v===null||v==="")return null;var n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n})(r.preis),name:r.name||"",info:String(r.hinweis||"").trim(),step:st,when:when,levels:lv.length?lv:null,conflict:[].concat(r.konflikt||[]).map(stepName),note:r.beschreibung||"",img:r.bild||"",
  types:tags.filter(function(t){return t!=="alle"&&TYPES[t]}),
  concerns:tags.filter(function(t,i,a){return CONCERNS[t]&&a.indexOf(t)===i}).concat(st==="Retinol / Anti-Aging"&&tags.indexOf("antiaging")<0?["antiaging"]:[])
 };
}
/* Spätere Dateien überschreiben frühere Einträge mit gleichem Link (Felder werden zusammengeführt). */
function mergeFiles(files){
 var order=[],map={};
 files.forEach(function(f){
  (Array.isArray(f)?f:(f&&f.produkte)||[]).forEach(function(r){
   if(!r||!r.link)return;
   var k=String(r.link).trim();
   if(!map[k]){map[k]={};order.push(k)}
   for(var key in r)map[k][key]=r[key];
   map[k].link=k;
  });
 });
 return order.map(function(k){return map[k]}).filter(function(r){return r.aktiv!==false}).map(norm);
}
var ERRORS=[];
function errText(e){var m=(e&&e.message)||String(e);return/^\d+$/.test(m)?"Datei nicht erreichbar (HTTP "+m+")":m}
function loadProducts(done){
 listFiles().then(function(names){
  var t=Math.floor(Date.now()/60000);
  return Promise.all(names.map(function(n){
   return getJSON(baseUrl()+CFG.ordner+"/"+encodeURIComponent(n)+"?t="+t).catch(function(e){
    ERRORS.push(n+": "+errText(e));
    try{console.error("Produktdatei fehlerhaft: "+n,e)}catch(x){}
    return[];
   });
  }));
 }).then(function(files){done(mergeFiles(files))},function(e){ERRORS.push("Dateiliste: "+errText(e));done([])});
}
/* Mit ?debug hinter der Adresse zeigt die Seite Dateifehler an. */
var DEBUG=/[?&]debug/.test(location.search);
function errBox(){
 if(!DEBUG||!ERRORS.length)return null;
 var d=document.createElement("div");d.className="warn";d.style.margin="0 0 28px";
 d.innerHTML="<b>Fehler in den Produktdateien:</b><br>"+ERRORS.map(esc).join("<br>");
 return d;
}
function emptyHtml(){
 return '<p class="empty">'+(ERRORS.length?"Die Produktliste konnte nicht vollständig geladen werden.":"Es sind noch keine Produkte hinterlegt.")+'</p>';
}

function typeOk(p){
 return(selT==="alle"||!p.types||!p.types.length||p.types.indexOf(selT)>-1)&&(tab==="produkte"||ignoreLvl||!p.levels||p.levels.indexOf(selL)>-1);
}
/* Erfahrung wird nur abgefragt, wenn die Routine ein Produkt mit Erfahrungswert enthalten würde (egal welcher Stufe). */
function levelRelevant(){
 ignoreLvl=true;
 try{return["am","pm"].some(function(t){return buildRows(t).some(function(r){return r.x.p.levels&&r.x.p.levels.length})})}
 finally{ignoreLvl=false}
}
function hits(p){return selC.filter(function(c){return p.concerns&&p.concerns.indexOf(c)>-1})}

/* ---------- Produktbilder ---------- */
/* Bild + Titel kommen automatisch über microlink.io. Logos und Platzhalter werden erkannt und nie angezeigt:
   dann wird erneut gesucht (mit Browser-Rendering), und wenn auch das scheitert, steht nur der Produktname da. */
var BADSET={};
try{BADSET=JSON.parse(localStorage.getItem("sg-badimg")||"{}")}catch(e){}
function saveBad(){try{localStorage.setItem("sg-badimg",JSON.stringify(BADSET))}catch(e){}}
var BADTOK=/(^|[\/_\-.,])(logo|favicon|apple-touch-icon|sprite|placeholder|noimage|no-image)([\/_\-.,?]|$)/i;
var BADNAME=/dauerhaft günstig online kaufen|^dm-drogerie markt$/i;
function badImage(u,d){
 if(!u||BADSET[u])return true;
 if(BADTOK.test(u)||/\.svg(\?|$)/i.test(u))return true;
 if(d&&d.logo&&d.logo.url&&d.logo.url===u)return true;
 var im=d&&d.image;
 if(im&&im.width&&im.height&&Math.max(im.width,im.height)<250)return true;
 return false;
}
/* Dasselbe Bild bei Produkten aus verschiedenen Schritten ist ein Logo oder Platzhalter, kein Produktfoto. */
function sharedOther(p,u){
 for(var k in CACHE){var c=CACHE[k];if(k!==p.url&&c&&c.img===u&&c.step!==p.step)return true}
 return false;
}
var rerenderTimer=null;
function rerenderSoon(){if(rerenderTimer)return;rerenderTimer=setTimeout(function(){rerenderTimer=null;render()},50)}
function blockImage(u){
 BADSET[u]=1;saveBad();
 for(var k in CACHE){if(CACHE[k]&&CACHE[k].img===u)delete CACHE[k]}
 save();rerenderSoon();
}
function meta(p,done){
 if(p.img&&p.name)return done({img:p.img,name:p.name});
 var m=CACHE[p.url];
 if(m&&((m.img&&!badImage(m.img))||(m.fail&&Date.now()-m.t<21600000)))return done({img:p.img||m.img,name:p.name||m.name});
 var tries=["","&prerender=true"],i=0,name="";
 function finish(u){

/* Routine zusammenstellen */
function pick(s,t,skip){
 skip=skip||[];
 var pool=PRODUCTS.filter(function(p){return p.step===s.k&&typeOk(p)&&(!p.when||p.when.indexOf(t)>-1)&&!(p.conflict||[]).some(function(c){return skip.indexOf(c)>-1})}).map(function(p){return{p:p,hit:hits(p)}});
 if(selC.length&&!s.base)pool=pool.filter(function(x){return x.hit.length>0});
 var chosen=[],covered=[];
 function gain(x){return x.hit.filter(function(c){return covered.indexOf(c)<0}).length}
 while(chosen.length<s.max&&pool.length){
  pool.sort(function(a,b){return gain(b)-gain(a)||b.hit.length-a.hit.length});
  var best=pool.shift();
  if(chosen.length&&gain(best)===0)break;
  chosen.push(best);covered=covered.concat(best.hit);
 }
 return chosen;
}
function buildRows(t){
 var rows=[],mk=selC.indexOf("makeup")>-1,oil=false;
 STEPS.forEach(function(s){
  if(s.when.indexOf(t)<0)return;
  var pk=pick(s,t);
  if(s.oil&&pk.length)oil=true;
  /* Abends: mit Make-up erst Öl, dann Cleanser (Double Cleansing). Ohne Make-up nur das Öl, sofern eines passt. */
  if(s.cleanser&&t==="pm"&&oil&&!mk)return;
  pk.forEach(function(x){rows.push({s:s,x:x,t:t})});
 });
 return rows;
}
/* Konflikte: "konflikt" enthält Schrittnamen oder Produkt-Links. Die Warnung erscheint bei beiden Produkten. */
function clash(a,b){
 function hit(x,y){return(x.conflict||[]).some(function(c){return c===y.step||c===y.url})}
 return hit(a,b)||hit(b,a);
}
function conflictRows(rows,i){
 if(lvlRel&&selL==="experte")return[];
 return rows.filter(function(o,j){return j!==i&&clash(rows[i].x.p,o.x.p)});
}
/* Alternative: gleicher Schritt, passt zum Hauttyp und zur Tageszeit, steht noch nicht in der Routine und kollidiert mit keinem anderen Produkt. */
function altFor(rows,i){
 if(!conflictRows(rows,i).length)return null;
 var r=rows[i],p=r.x.p,others=rows.filter(function(o,j){return j!==i}),used=rows.map(function(o){return o.x.p.url});
 var pool=PRODUCTS.filter(function(q){
  return q.step===p.step&&used.indexOf(q.url)<0&&typeOk(q)&&(!q.when||q.when.indexOf(r.t)>-1)&&!others.some(function(o){return clash(q,o.x.p)});
 });
 pool.sort(function(a,b){return hits(b).length-hits(a).length});
 return pool[0]||null;
}
function warnText(names){

}
function missingBase(rows,t){
 var mk=selC.indexOf("makeup")>-1,oil=rows.some(function(r){return r.s.oil});
 return STEPS.filter(function(s){
  if(!s.base||s.when.indexOf(t)<0)return false;
  if(s.cleanser&&t==="pm"&&oil&&!mk)return false;
  return !rows.some(function(r){return r.s.k===s.k});
 }).map(function(s){return s.k});
}

function fmt(n){try{return n.toLocaleString("de-DE",{style:"currency",currency:"EUR"})}catch(e){return n.toFixed(2).replace(".",",")+" €"}}

 if(p.price==null)return"";

function planTotal(d){
 var seen={},sum=0;
 ["am","pm"].forEach(function(k){d[k].forEach(function(r){var u=r.x.p.url;if(!seen[u]){seen[u]=1;sum+=price(r.x.p)}})});
 return sum;
}
/* Liegt die Routine über dem Budget, werden Produkte durch günstigere Alternativen desselben Schritts ersetzt
   (mit möglichst wenig Verlust bei den Themen). Reicht das nicht, entfallen optionale Schritte. Basis-Schritte bleiben. */
function buildPlan(){
 var d={am:buildRows("am"),pm:buildRows("pm")},info={swaps:0,drops:0,over:false,origin:{},moves:{}},guard=0;
 if(selB!=null&&hasPrices()){
  while(planTotal(d)>selB&&guard++<80){
   var best=null,seen={};
   var cand=function(a){if(!best||a.cost<best.cost||(a.cost===best.cost&&a.save>best.save))best=a};
   ["am","pm"].forEach(function(k){d[k].forEach(function(r){
    var p=r.x.p;if(seen[p.url])return;seen[p.url]=1;
    PRODUCTS.forEach(function(q){
     if(q.step!==p.step||q.url===p.url||q.price==null||q.price>=price(p)||!typeOk(q))return;
     var ok=true;
     ["am","pm"].forEach(function(k2){d[k2].forEach(function(r2){
      if(r2.x.p.url===p.url&&q.when&&q.when.indexOf(r2.t)<0)ok=false;
      if(r2.x.p.url===q.url)ok=false;
     })});
     if(ok)cand({t:"swap",p:p,q:q,cost:Math.max(0,hits(p).length-hits(q).length),save:price(p)-q.price});
    });
    var sd=STEPS.filter(function(x){return x.k===p.step})[0];
    if(sd&&!sd.base&&price(p)>0)cand({t:"drop",p:p,cost:hits(p).length+3,save:price(p)});
   })});
   if(!best)break;
   var org=info.origin[best.p.url]||best.p;
   var tm=["am","pm"].filter(function(k){return d[k].some(function(r){return r.x.p.url===best.p.url})});
   if(best.t==="swap"){
    ["am","pm"].forEach(function(k){d[k].forEach(function(r){if(r.x.p.url===best.p.url)r.x={p:best.q,hit:hits(best.q)}})});
    info.origin[best.q.url]=org;
    info.moves[org.url]={orig:org,now:best.q,times:tm};
   }else{
    ["am","pm"].forEach(function(k){d[k]=d[k].filter(function(r){return r.x.p.url!==best.p.url})});
    info.moves[org.url]={orig:org,now:null,times:tm};
   }
  }
  info.over=planTotal(d)>selB;
  Object.keys(info.moves).forEach(function(k){if(info.moves[k].now)info.swaps++;else info.drops++});
 }
 return{d:d,info:info};
}
function costHtml(plan){
 var d=plan.d,tot=planTotal(d),seen={},np=0,n;
 ["am","pm"].forEach(function(k){d[k].forEach(function(r){if(!seen[r.x.p.url]){seen[r.x.p.url]=1;if(r.x.p.price==null)np++}})});
 var h="Gesamtkosten der Routine (morgens und abends): <b>"+fmt(tot)+"</b>.";
 if(np)h+=" Bei "+np+(np===1?" Produkt fehlt der Preis, es ist":" Produkten fehlt der Preis, sie sind")+" nicht eingerechnet.";
 if(selB!=null){
  h+=" Dein Budget: bis <b>"+fmt(selB)+"</b>.";
  var a=[];
  if(plan.info.swaps)a.push(plan.info.swaps+(plan.info.swaps===1?" Produkt durch ein günstigeres ersetzt":" Produkte durch günstigere ersetzt"));
  if(plan.info.drops)a.push(plan.info.drops+(plan.info.drops===1?" optionalen Schritt weggelassen":" optionale Schritte weggelassen"));
  if(a.length)h+=" Dafür habe ich "+a.join(" und ")+".";
  if(plan.info.over)h+=" Mit diesem Budget ist keine vollständige Routine möglich, die günstigste Zusammenstellung kostet "+fmt(tot)+".";
 }
 return h;
}

function resolveNames(rows,cb){
 var jobs=[];
 rows.forEach(function(r,i){
  jobs.push({p:r.x.p,set:function(n){r.name=n}});
  var a=altFor(rows,i);
  if(a)jobs.push({p:a,set:function(n){r.alt={p:a,name:n}}});
 });
 var n=jobs.length,c=0;
 if(!n)return cb();
 jobs.forEach(function(j){meta(j.p,function(m){j.set(m.name||j.p.name||"Produkt");if(++c===n)cb()})});
}

function wrapText(ctx,text,x,y,maxW,lh,maxLines){
 var words=String(text||"").split(/\s+/),line="",lines=[];
 words.forEach(function(w){
  var t=line?line+" "+w:w;
  if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t;
 });
 if(line)lines.push(line);
 if(lines.length>maxLines){
  lines=lines.slice(0,maxLines);
  var l=lines[maxLines-1];
  while(l.length&&ctx.measureText(l+"…").width>maxW)l=l.slice(0,-1);
  lines[maxLines-1]=l+"…";
 }

 return y+lines.length*lh;
}

   ctx.fillStyle="#fff";ctx.font="500 18px "+F;ctx.textAlign="center";ctx.textBaseline="middle";

   if(r.x.p.price!=null){ctx.textAlign="right";ctx.fillStyle=C.soft;ctx.font="400 17px "+F;ctx.fillText(fmt(r.x.p.price),W-pad,top+16);ctx.textAlign="left"}
   ctx.fillStyle=C.ink;ctx.font="500 26px "+F;

   var lastLine=r.x.p.note?yn-27:last;

   if(r.x.hit.length){

     ctx.fill();
     ctx.fillStyle=C.ink;ctx.fillText(CONCERNS[c],px+13,py+21);

    });

   }
   if(r.x.p.info){

   }

   if(cr.length){

   }

}
function infoHtml(t){
 return '<p class="info"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg><span>'+esc(t)+'</span></p>';
}
function renderRoutine(out){
 if(loading){out.innerHTML='<p class="empty">Produkte werden geladen …</p>';return}
 if(!PRODUCTS.length){out.innerHTML=emptyHtml();return}
 var wrap=document.createElement("div");
 var tg=document.createElement("div");tg.className="daytoggle";tg.setAttribute("role","group");tg.setAttribute("aria-label","Tageszeit");
 ["am","pm"].forEach(function(k){
  var b=document.createElement("button");b.type="button";b.className="dt";b.setAttribute("aria-pressed",String(k===time));
  b.innerHTML=ICON[k]+"<span>"+TIMES[k]+"</span>";
  b.onclick=function(){time=k;render()};tg.appendChild(b);
 });
 wrap.appendChild(tg);
 var plan=buildPlan(),rows=plan.d[time],covered=[];
 ["am","pm"].forEach(function(k){plan.d[k].forEach(function(r){covered=covered.concat(r.x.hit)})});
 if(!rows.length){var e=document.createElement("p");e.className="empty";e.textContent="Für diese Auswahl gibt es noch keine Produkte. Probiere einen anderen Hauttyp oder andere Themen.";wrap.appendChild(e);out.appendChild(wrap);return}
 if(selC.length){
  var miss=selC.filter(function(c){return covered.indexOf(c)<0}).map(function(c){return CONCERNS[c]});
  var ok=selC.filter(function(c){return covered.indexOf(c)>-1}).map(function(c){return CONCERNS[c]});
  var s=document.createElement("p");s.className="sum";
  s.innerHTML=(ok.length?"Diese Routine deckt <b>"+esc(ok.join(", "))+"</b> ab. ":"")+(miss.length?"Dafür habe ich noch kein passendes Produkt: <b>"+esc(miss.join(", "))+"</b>.":"");
  var mb=missingBase(rows,time);
  if(mb.length)s.innerHTML+=" Für deinen Hauttyp fehlt mir noch ein Produkt für: <b>"+esc(mb.join(", "))+"</b>.";
  wrap.appendChild(s);
 }else{
  var s2=document.createElement("p");s2.className="sum";s2.textContent="Wähle oben ein oder mehrere Themen, dann passt sich die Routine an.";
  var mb2=missingBase(rows,time);
  if(mb2.length)s2.textContent+=" Für deinen Hauttyp fehlt mir noch ein Produkt für: "+mb2.join(", ")+".";
  wrap.appendChild(s2);
 }
 if(hasPrices()){var cp=document.createElement("p");cp.className="sum";cp.innerHTML=costHtml(plan);wrap.appendChild(cp)}
 if(hasPrices()){var nb=debugBox(plan);if(nb)wrap.appendChild(nb)}
 var ol=document.createElement("ol");ol.className="routine";
 rows.forEach(function(r,i){
  var p=r.x.p,li=document.createElement("li");li.className="row";
  var tags=r.x.hit.map(function(c){return '<span class="tag">'+esc(CONCERNS[c])+'</span>'}).join("");
  li.innerHTML='<a class="rowlink" href="'+esc(p.url)+'" target="_blank" rel="noopener sponsored"><div class="num">'+(i+1)+'</div><div class="rimg"><span>Bild wird geladen</span></div><div><div class="step">'+esc(r.s.k)+'</div><p class="name">'+esc(p.name||"")+'</p><p class="note">'+esc(p.note)+'</p>'+(p.info?infoHtml(p.info):'')+(r.s.hint?infoHtml(r.s.hint):'')+(tags?'<div class="tags">'+tags+'</div>':'')+'<span class="go">Zum Produkt</span>'+priceHtml(p)+'</div></a><div class="extra" hidden><p class="warn"></p><div class="alt"></div></div>';
  ol.appendChild(li);
  meta(p,function(m){fillImage(li.querySelector(".rimg"),m);li.querySelector(".name").textContent=m.name||"Produkt ansehen"});
  var others=conflictRows(rows,i);
  if(others.length){
   var ex=li.querySelector(".extra"),w=li.querySelector(".warn"),names=[],n=0,ap=altFor(rows,i);
   others.forEach(function(o,k){meta(o.x.p,function(m){
    names[k]=m.name||o.x.p.name||"anderes Produkt";
    if(++n===others.length){w.textContent=warnText(names);ex.hidden=false}
   })});
   if(ap){
    var al=li.querySelector(".alt");
    al.innerHTML='<a class="altlink" href="'+esc(ap.url)+'" target="_blank" rel="noopener sponsored"><span class="aimg"><span>…</span></span><span><span class="alabel">Alternative</span><span class="aname"></span></span></a>';
    meta(ap,function(m){fillImage(al.querySelector(".aimg"),m);al.querySelector(".aname").textContent=m.name||"Produkt ansehen"});
   }
  }
 });
 wrap.appendChild(ol);wrap.appendChild(saveBar());out.appendChild(wrap);
}

/* Alle Produkte (gefiltert) */
function renderProducts(out){
 if(loading){out.innerHTML='<p class="empty">Produkte werden geladen …</p>';return}
 if(!PRODUCTS.length){out.innerHTML=emptyHtml();return}
 var list=PRODUCTS.filter(function(p){return typeOk(p)&&(!selC.length||hits(p).length>0)});
 list.sort(function(a,b){return hits(b).length-hits(a).length});
 if(!list.length){out.innerHTML='<p class="empty">Dafür gibt es noch keine Empfehlung. Wähle ein anderes Thema.</p>';return}
 var grid=document.createElement("div");grid.className="grid";
 list.forEach(function(p){
  var a=document.createElement("a");a.className="card";a.href=p.url;a.target="_blank";a.rel="noopener sponsored";
  a.innerHTML='<div class="img"><span>Bild wird geladen</span></div><div class="step">'+esc(p.step)+lvlHtml(p)+'</div><p class="name">'+esc(p.name||"")+'</p><p class="note">'+esc(p.note)+'</p>'+cardTags(p)+(p.info?infoHtml(p.info):'')+'<span class="go">Zum Produkt</span>'+priceHtml(p);
  grid.appendChild(a);
  meta(p,function(m){fillImage(a.querySelector(".img"),m);a.querySelector(".name").textContent=m.name||"Produkt ansehen"});
 });
 out.appendChild(grid);
}

function render(){
 try{localStorage.setItem("sg-sel",JSON.stringify({t:selT,c:selC,m:time,l:selL,b:selB}))}catch(e){}
 var tb=$("sg-tabs");tb.innerHTML="";
 Object.keys(TABS).forEach(function(k){
  var b=document.createElement("button");b.className="tab";b.type="button";b.setAttribute("role","tab");
  b.setAttribute("aria-selected",String(k===tab));b.textContent=TABS[k];
  b.onclick=function(){tab=k;render()};tb.appendChild(b);
 });
 mkChips($("sg-types"),pairs(TYPES),function(k){return k===selT},function(k){selT=k;render()});
 var cItems=[["alle",tab==="produkte"?"Alle":"Basic"]].concat(pairs(CONCERNS));
 mkChips($("sg-concerns"),cItems,function(k){return k==="alle"?selC.length===0:selC.indexOf(k)>-1},function(k){
  if(k==="alle")selC=[];
  else{var i=selC.indexOf(k);if(i>-1)selC.splice(i,1);else selC.push(k)}
  render();
 });
 mkChips($("sg-levels"),pairs(LEVELS),function(k){return k===selL},function(k){selL=k;render()});
 var onP=tab==="produkte";
 lvlRel=onP?false:levelRelevant();
 $("sg-lh").hidden=!lvlRel;$("sg-levels").hidden=!lvlRel;
 var ln=$("sg-lnote");
 if(selL==="experte"&&lvlRel){ln.hidden=false;ln.textContent="Im Experten-Modus sind Warnhinweise und Alternativen ausgeblendet."}else ln.hidden=true;
 renderBudget();
 var tip=$("sg-tip");
 if(TIPS[selT]){tip.hidden=false;tip.innerHTML="<b>"+TIPS[selT][0]+"</b>"+TIPS[selT][1]}else tip.hidden=true;
 var out=$("sg-out");out.innerHTML="";
 if(tab==="routine")renderRoutine(out);else renderProducts(out);
 var eb=errBox();if(eb)out.insertBefore(eb,out.firstChild);
}
render();
loadProducts(function(list){PRODUCTS=list;loading=false;render()});
})();
</script>
</div>
