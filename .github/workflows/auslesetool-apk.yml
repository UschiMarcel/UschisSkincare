name: Auslesetool APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'produkte/**', 'bilder/**', 'scripts/**', 'android/**', '.github/workflows/auslesetool-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auslesetool bauen (nur der Leser, nicht die öffentliche Seite)
        run: |
          python3 scripts/build_leser.py --ziel android/app/src/main/assets
          rm -f android/app/src/main/assets/LIESMICH.md
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Skincare-Auslesetool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
