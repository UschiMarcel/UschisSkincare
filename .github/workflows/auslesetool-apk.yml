name: Auslesetool APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'produkte/**', 'bilder/**', 'scripts/**', 'android/**', '.github/workflows/auslesetool-apk.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auslesetool bauen (nur der Leser, nicht die öffentliche Seite)
        run: |
          python3 scripts/build_leser.py --ziel android/app/src/main/assets
          rm -f android/app/src/main/assets/LIESMICH.md
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: APK bauen
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Skincare-Auslesetool-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK kurz auf Hilfszweig legen (zum Abholen)
        run: |
          mkdir /tmp/apk && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/apk/Skincare-Auslesetool.apk
          cd /tmp/apk && git init -q -b apk-temp && git config user.email "ci@users.noreply.github.com" && git config user.name "ci" \
            && git add . && git commit -qm "apk" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-temp
