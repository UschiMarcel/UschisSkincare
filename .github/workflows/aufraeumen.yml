name: Aufräumen (einmalig)
on:
  push:
    paths: ['.github/workflows/aufraeumen.yml']
permissions:
  contents: write
  actions: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hilfszweig, Artefakte und alte Läufe löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --delete apk-temp || true
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate --jq '.artifacts[].id'); do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true; done
          for id in $(gh api "repos/${{ github.repository }}/actions/runs" --paginate --jq '.workflow_runs[]|select(.name!="Aufräumen (einmalig)")|select(.path|test("pages")|not)|.id'); do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" || true; done
